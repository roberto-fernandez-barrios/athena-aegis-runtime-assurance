[build-system]
requires = ["setuptools==80.9.0", "wheel==0.45.1"]
build-backend = "setuptools.build_meta"

[project]
name = "athena-aegis-runtime-assurance"
version = "0.1.0"
description = "Context-conditioned longitudinal assurance for hybrid quantum-classical services"
readme = "README.md"
license = {text = "Apache-2.0"}
requires-python = ">=3.11,<3.14"
dependencies = [
  "numpy>=2.0,<3",
  "jsonschema>=4.23,<5",
]

[project.optional-dependencies]
quantum = [
  "qiskit>=2.5,<3",
  "qiskit-aer>=0.17,<1",
]
ibm = ["qiskit-ibm-runtime>=0.49,<0.50"]
dev = [
  "pytest>=9,<10",
  "pytest-cov>=7,<8",
]

[project.scripts]
athena-aegis-preflight = "athena_aegis.providers.ibm_preflight:main"
athena-aegis-build-metadata-matrix = "athena_aegis.analysis.build_metadata_matrix:main"
athena-aegis-build-endpoints = "athena_aegis.analysis.build_endpoint_tables:main"
athena-aegis-build-manifest = "athena_aegis.analysis.build_manifest:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra -p no:cacheprovider"

[tool.coverage.run]
source = ["athena_aegis"]
branch = true
